[package]
name = "rokajit-ee"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "C++ ABI gasket between CoreCLR's EE and the RokaJIT Rust core"

[dependencies]
rokajit-ffi = { path = "../rokajit-ffi" }

[build-dependencies]
cc = "1"

[features]
# Exposes the `mock` module (`MockEe`) to downstream crates' tests.
mock = []
